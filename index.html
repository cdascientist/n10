<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IN/TENSION — Bodywork, Heat, Movement &amp; Fuel</title>
<meta name="description" content="Swedish bodywork, infrared sauna, cold plunge, movement and the Fuel Lab. Ninety minutes to reset a whole week.">
<meta name="theme-color" content="#8B2BFF">
<!-- Static boot layer: paints the brand purple from the very first byte,
     before the JS bundle loads. React removes #boot on mount; the app's own
     purple preloader takes over seamlessly. -->
<style>
  html{background:#8B2BFF}
  #boot{position:fixed;inset:0;z-index:999;pointer-events:none;
        background:radial-gradient(1100px 640px at 50% 30%,#A855FF 0%,#8B2BFF 58%);
        animation:bootFade .9s ease 10s forwards}
  @keyframes bootFade{to{opacity:0;visibility:hidden}}
</style>
<div id="boot"></div>
<!-- Eagerly fetch the hero shots (above the preloader) so the page is fully
     rendered the moment the preloader fades. Below-fold shots are eager in
     the DOM too — the preloader holds until everything is decoded. -->
<link rel="preload" as="image" href="https://images.unsplash.com/photo-1741522509438-a120c0bb5e88?fm=jpg&q=76&w=1800&auto=format&fit=crop">
<link rel="preload" as="image" href="https://images.unsplash.com/photo-1745327883508-b6cd32e5dde5?fm=jpg&q=76&w=1800&auto=format&fit=crop">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
