<!-- Static boot layer: paints the brand purple from the very first byte,
     before the JS bundle loads. React removes #boot on mount; the app's own
     purple preloader takes over seamlessly. -->
<style>
  html{background:#8B2BFF}
  #boot{position:fixed;inset:0;z-index:999;pointer-events:none;
        background:radial-gradient(1100px 640px at 50% 30%,#A855FF 0%,#8B2BFF 58%)}
</style>
<div id="boot"></div>
</head>
